services:
  backend:
    build:
      context: .
      dockerfile: backend/Dockerfile
    container_name: multi-llm-backend
    restart: unless-stopped
    environment:
      DATABASE_URL: sqlite+aiosqlite:////data/debate.db
      HOST: 0.0.0.0
      PORT: 8000
      AUTH_COOKIE_SECURE: "false"
    volumes:
      - ./config:/app/config:ro
      - debate_data:/data
      - uploads_data:/app/backend/uploads
    ports:
      - "8000:8000"
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://localhost:8000/api/health')"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 40s

  frontend:
    build:
      context: .
      dockerfile: frontend-new/Dockerfile
    container_name: multi-llm-frontend
    restart: unless-stopped
    depends_on:
      backend:
        condition: service_healthy
    ports:
      - "3000:80"
    healthcheck:
      test: ["CMD-SHELL", "curl -f http://localhost:80/ || exit 1"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 20s

volumes:
  debate_data:
  uploads_data:
