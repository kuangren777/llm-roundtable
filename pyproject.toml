[project]
name = "multi-llm-debate"
version = "1.0.0"
description = "Multi-agent round table discussion platform"
requires-python = ">=3.10"

[tool.pytest.ini_options]
asyncio_mode = "auto"
testpaths = ["unit_test"]
addopts = "--cov=backend --cov-report=html --cov-report=term-missing"

[tool.coverage.run]
source = ["backend"]
omit = ["backend/alembic/*", "unit_test/*", "backend/app/alembic/*"]

[tool.coverage.report]
exclude_lines = ["pragma: no cover", "if __name__", "if TYPE_CHECKING"]
